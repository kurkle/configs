name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      fetch-depth: 0
      run-audit-signatures: true
      run-typecheck: false
      run-build: false
      test-command: ''
      browser-tests: false
      coverage-paths: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [shared-ci]
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm clean-install --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --no-install semantic-release

      # Consumers pin the reusable workflow as `@v1`, so the floating major tag
      # has to follow every release made from this branch.
      - name: Move floating major version tag
        run: |
          VERSION=$(git describe --tags --exact-match HEAD 2>/dev/null | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "No release tag on HEAD, floating tag left untouched"
            exit 0
          fi
          MAJOR="v${VERSION%%.*}"
          git tag --force "$MAJOR" HEAD
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $(git rev-parse --short HEAD) (v$VERSION)"
