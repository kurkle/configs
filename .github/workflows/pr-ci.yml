name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      fetch-depth: 1
      run-audit-signatures: false
      run-typecheck: false
      run-build: false
      browser-tests: false
      coverage-paths: coverage/unit/lcov.info
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
