sonar.projectKey=kurkle_configs
sonar.organization=kurkle

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=configs

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=bin,.github/workflows

sonar.tests=test

# Produced by `npm test` (node --test --experimental-test-coverage), uploaded
# as a CI artifact and downloaded back down before this scan runs (see
# shared-ci.yml's coverage-paths / Sonar job). Both paths are listed because
# actions/upload-artifact strips the common ancestor directory of whatever
# path(s) it is given; with this repo's single lcov file that ancestor is
# ambiguous between the two, and Sonar simply ignores whichever one is absent.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/lcov.info

# The floating v1 tag is deliberate: it is how a fix in kurkle/configs reaches
# every repository without a pull request in each one. Pinning a commit SHA
# would defeat that mechanism.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml
